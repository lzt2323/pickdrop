        </article>
      </div>
      <div class="pd-detail text-small" aria-live="polite">保留完整动物，在清晰的容器里显示群组状态。</div>
    </section>
  </div>
</div>

</style>
<script>
(() => {
  const root = document.getElementById('pickdrop-edge-study');
  const saved = window.openai?.widgetState?.privateContent?.states || [];
  const models = [], renders = [];
  root.querySelectorAll('[data-variant]').forEach((variant, index) => {
    const stage = variant.querySelector('.pd-stage');
    const state = { mode:saved[index]?.mode || 'peek', draft:!!saved[index]?.draft, side:saved[index]?.side || 'right', radius:16, delay:300 };
    models.push(state);
    const panel = variant.querySelector('.pd-panel');
    const detail = variant.querySelector('.pd-detail');
    const input = variant.querySelector('input');
    let hoverTimer, leaveTimer;
    function persist() {
      const modelContent = { edgeDesign:variant.dataset.variant, state:state.mode, side:state.side, pendingFile:state.draft };
      window.openai?.setWidgetState?.({ modelContent, privateContent:{states:models.map(s=>({mode:s.mode,draft:s.draft,side:s.side}))} })?.catch(()=>{});
    }
    function render() {
      stage.dataset.mode = state.mode; stage.dataset.side = state.side;
      stage.style.setProperty('--pd-radius',state.radius+'px');
      panel.inert = state.mode === 'collapsed';
      variant.querySelector('.pd-draft').hidden = !state.draft;
      variant.querySelector('.pd-composer').hidden = !['active','drop'].includes(state.mode);
      variant.querySelector('.pd-preview-footer').hidden = !['peek'].includes(state.mode);
      variant.querySelector('.pd-send').disabled = !(input.value.trim() || state.draft);
      detail.textContent = state.mode === 'collapsed' ? (state.draft ? '已收起，待发送的文件仍然保留。' : '边缘入口保留群组身份与未读状态。') : state.mode === 'peek' ? '悬停只看最近文件，原应用保留键盘焦点。' : state.mode === 'drop' ? '文件已加入草稿，核对目标群后点击发送。' : '点击后进入操作状态，鼠标离开不会打断输入。';
    }
    function change(mode) { clearTimeout(hoverTimer); clearTimeout(leaveTimer); state.mode = mode; if(mode==='drop')state.draft=true; render(); persist(); }
    variant.querySelectorAll('[data-demo]').forEach(b=>b.addEventListener('click',()=>change(b.dataset.demo)));
    variant.querySelector('.pd-anchor').addEventListener('pointerenter',()=>{ if(state.mode==='collapsed')hoverTimer=setTimeout(()=>change('peek'),state.delay); });
    stage.addEventListener('pointerenter',()=>clearTimeout(leaveTimer));
    stage.addEventListener('pointerleave',()=>{ clearTimeout(hoverTimer); if(state.mode==='peek')leaveTimer=setTimeout(()=>change('collapsed'),700); });
    variant.querySelector('.pd-anchor').addEventListener('click',()=>change('active'));
    variant.querySelector('.pd-open').addEventListener('click',()=>change('active'));
    variant.querySelector('.pd-close').addEventListener('click',()=>change('collapsed'));
    variant.querySelector('.pd-add').addEventListener('click',()=>change('drop'));
    variant.querySelector('.pd-remove').addEventListener('click',()=>{state.draft=false;state.mode='active';render();persist();});
    input.addEventListener('input',render);
    variant.querySelector('.pd-composer').addEventListener('submit',e=>e.preventDefault());
    variant.querySelector('.pd-send').addEventListener('click',()=>{state.draft=false;input.value='';state.mode='active';render();detail.textContent='模拟发送完成 · 目标：设计素材';persist();});
    stage.addEventListener('keydown',e=>{if(e.key==='Escape')change('collapsed');});
    renders.push(render); render();
    if(globalThis.Tweak) { const tweak=new Tweak({container:stage,onChange:render}); tweak.addSelect(state,'side',{label:'停靠侧',options:[{label:'右侧',value:'right'},{label:'左侧',value:'left'}]}); tweak.addSlider(state,'delay',{label:'悬停意图',min:200,max:600,step:50,unit:'ms'}); }
  });
  window.addEventListener('openai:set_globals',event=>{ const states=event.detail?.globals?.widgetState?.privateContent?.states;if(!states)return;states.forEach((saved,index)=>{if(models[index])Object.assign(models[index],saved);});renders.forEach(render=>render()); });
})();
</script>
