<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拾传 · 终端原型</title><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="terminal.css"></head><body><main class="terminal" aria-label="拾传终端交互演示"><header><strong>拾传</strong><button id="group-button" aria-haspopup="dialog">设计协作 ▾</button><span class="online">3 在线</span></header><nav aria-label="终端视图"><button data-view="messages" aria-current="page">会话</button><button data-view="tasks">传输 <span>2</span></button><button data-view="files">发文件</button><button data-view="devices">设备</button></nav><div class="context"><span id="context-name">今天</span><span id="context-value">本机 / Studio Mac</span></div><section id="list" tabindex="0" aria-label="文件和消息，方向键选择"></section><section class="detail" id="detail" aria-live="polite"></section><footer><span>↑↓ 选择</span><span>Enter 打开</span><button id="send-shortcut">Ctrl+O 发文件</button><span>Esc 返回</span></footer></main><dialog id="panel"><form method="dialog"><button class="close" aria-label="关闭">×</button></form><div id="panel-content"></div></dialog><script src="terminal.js"></script></body></html>
