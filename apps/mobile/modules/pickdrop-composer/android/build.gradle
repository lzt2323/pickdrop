plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'app.pickdrop.composer'
version = '1.0.0'
android {
  namespace 'app.pickdrop.composer'
  defaultConfig { versionCode 1; versionName '1.0.0' }
}
// RootView is a direct compile-time dependency for residual IME overlap metrics.
dependencies {
  implementation 'com.facebook.react:react-android'
}
