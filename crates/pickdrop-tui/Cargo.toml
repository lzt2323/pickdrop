[package]
name = "pickdrop-tui"
version = "0.6.0-alpha.14"
edition = "2021"

[[bin]]
name = "pickdrop"
path = "src/main.rs"

[dependencies]
pickdrop-core = { path = "../pickdrop-core" }
anyhow = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
crossterm = { version = "0.29", features = ["event-stream"] }
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"
