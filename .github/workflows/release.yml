name: PickDrop Unified Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify tag, package versions and release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_KIND: ${{ github.ref_type }}
        run: node scripts/verify-versions.js
  tauri:
    needs: verify
    uses: ./.github/workflows/tauri.yml
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, tauri]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: tauri-desktop-*
          merge-multiple: true
          path: .build/release/input
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tauri-android-arm64
          path: .build/release/input
      - run: node scripts/tauri-release-manifest.js .build/release/input .build/release/assets
      - name: Publish verified prerelease without overwriting existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Release already exists; refusing asset overwrite."
            exit 1
          fi
          gh release create "$RELEASE_TAG" .build/release/assets/* --verify-tag --prerelease --title "拾传 $RELEASE_TAG · Tauri 内测" --notes-file "docs/releases/$RELEASE_TAG.md"
